[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eleanor-unified-agent"
version = "0.2.0"
description = "Eleanor Unified Agent orchestration layer with GitSync and multi-provider adapters"
authors = [
  { name = "at0116218-dot", email = "at0116218-dot@example.com" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

dependencies = [
  "requests>=2.28",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "ruff>=0.11",
  "mypy>=1.0",
  "semgrep>=1.0",
  "bandit>=1.7"
]

[tool.ruff]
line-length = 88

[tool.mypy]
python_version = 3.10
ignore_missing_imports = true
